# Kun LAN og ingen TLS endnu. Senere: listener 8883 med cafile/certfile/keyfile.
listener 1883
allow_anonymous false

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
