# Lokal udvikling: DB + Mosquitto. API'en køres på værten med `npm run start:dev`.
# Opret docker/mosquitto/passwd FØR første `docker compose up` (se README).

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    entrypoint: ['/bin/sh', '/mosquitto/config-src/entrypoint.sh']
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./docker/mosquitto:/mosquitto/config-src
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
